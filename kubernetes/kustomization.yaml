apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: todo-app

resources:
  - namespace.yaml
  - configmap.yaml
  - secrets.yaml
  - mongodb-pvc.yaml
  - mongodb-deployment.yaml
  - mongodb-service.yaml
  - backend-deployment.yaml
  - backend-service.yaml
  - frontend-deployment.yaml
  - frontend-service.yaml
  - backend-hpa.yaml
  - frontend-hpa.yaml

# Uncomment for Ingress (requires nginx-ingress controller)
# resources:
#   - ingress.yaml

commonLabels:
  app: todo-application
  version: v1
