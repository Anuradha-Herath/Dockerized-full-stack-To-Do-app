apiVersion: v1
kind: ConfigMap
metadata:
  name: todo-backend-config
  namespace: todo-app
data:
  NODE_ENV: "production"
  MONGODB_DATABASE: "todoapp"
  PORT: "5000"
  MONGODB_HOST: "todo-mongodb"
  MONGODB_PORT: "27017"
  MONGODB_URI: "mongodb://todo-mongodb:27017/todoapp"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: todo-frontend-config
  namespace: todo-app
data:
  VITE_API_URL: "http://todo-backend:5000"
  NGINX_BACKEND_URL: "http://todo-backend:5000"
