apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: default
  labels:
    app: todo-app
    component: frontend
spec:
  type: NodePort
  ports:
  - port: 3000
    targetPort: 3000
    nodePort: 30000
    protocol: TCP
    name: web
  selector:
    app: todo-app
    component: frontend
